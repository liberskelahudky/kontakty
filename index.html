<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kontakty LL</title>
<meta name="description" content="Kdo je kdo v Libeřských lahůdkách – kontakty, oddělení a na koho se obrátit.">
<meta name="theme-color" content="#f6f2ee">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kontakty LL">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<style id="st">
/* Layout: adresář podle organizační struktury. Nahoře „Co potřebujete vyřešit?“ (téma → člověk), pod tím oddělení s popisem; lidé jako velké fotokarty (2 sloupce na mobilu), vedoucí a lidé s tématy jako široké karty */
:root{
  --bg:#f6f2ee; --surface:#ffffff; --surface-2:#efe8e1; --fg:#1d1411; --muted:#80705f; --line:#e7ded4;
  --accent:#6e3326; --accent-fg:#ffffff; --accent-soft:#f3e3da; --gold:#b08a5a;
  --work:#2f6b45; --work-soft:#e3f1e7; --priv:#a0521c; --priv-soft:#fbeadb; --danger:#b3392c;
  --glass:rgba(246,242,238,.88); --shadow:0 1px 2px rgba(60,30,20,.06),0 8px 24px rgba(60,30,20,.07);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130f0e; --surface:#1d1716; --surface-2:#29211f; --fg:#f5ede8; --muted:#a8968a; --line:#2f2624;
  --accent:#e2a48f; --accent-fg:#1d1210; --accent-soft:#3a2521; --gold:#d2ae7c;
  --work:#8fd3a5; --work-soft:#1d3226; --priv:#f0b07e; --priv-soft:#3b2919; --danger:#f08a7c;
  --glass:rgba(19,15,14,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f0e; --surface:#1d1716; --surface-2:#29211f; --fg:#f5ede8; --muted:#a8968a; --line:#2f2624;
  --accent:#e2a48f; --accent-fg:#1d1210; --accent-soft:#3a2521; --gold:#d2ae7c;
  --work:#8fd3a5; --work-soft:#1d3226; --priv:#f0b07e; --priv-soft:#3b2919; --danger:#f08a7c;
  --glass:rgba(19,15,14,.88); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.page{max-width:1240px;margin:0 auto;padding-inline:16px}
.top{padding-block:24px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--accent)}
h1{margin:2px 0 0;font-size:2.1rem;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.updated{font-size:.75rem;color:var(--muted);margin-top:5px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn svg{width:19px;height:19px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding-block:10px 8px;margin-inline:-16px;padding-inline:16px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px;color:var(--fg);outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding-block:4px 120px}
/* quick topics */
.quick{margin-top:18px}
.q-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 10px}
.q-h h2{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.q-h span{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.q-h span{display:none}}
.q-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scroll-snap-type:x mandatory}
.q-row::-webkit-scrollbar{display:none}
.qcard{flex:none;width:224px;scroll-snap-align:start;background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:var(--fg)}
.qcard .qt{font-weight:700;font-size:1.02rem;line-height:1.2}
.qcard .qd{font-size:.8rem;color:var(--muted);line-height:1.35;flex:1}
.qcard .qw{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:.85rem;font-weight:600}
.qcard .qw img,.qcard .qw .mono{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;font-size:.75rem}
.qcard .qw .arrow{margin-left:auto;color:var(--accent);font-size:1.1rem}
.qcard.add-q{box-shadow:none;border:2px dashed var(--line);justify-content:center;align-items:center;color:var(--accent);font-weight:600}
@media (min-width:900px){.q-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0}.qcard{width:auto}}
/* departments */
.dept{margin-top:34px}
#out>.dept:first-child{margin-top:12px}
.d-top{display:flex;align-items:flex-start;gap:10px;margin:0 2px 12px}
.d-top .tt{flex:1;min-width:0}
.d-top h2{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.d-top .ab{font-size:.88rem;color:var(--muted);margin-top:4px;max-width:62ch}
.d-top .cnt{flex:none;font-size:.75rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;margin-top:6px}
.d-edit{flex:none;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:600;padding:0 10px;cursor:pointer;color:var(--accent)}
details.team{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
details.team summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px}
details.team summary::-webkit-details-marker{display:none}
details.team summary::after{content:"+";margin-left:auto;font-size:1.2rem;color:var(--accent);font-weight:500}
details.team[open] summary::after{content:"–"}
details.team ul{margin:0;padding:0 16px 14px 34px;columns:2 260px;column-gap:28px;font-size:.88rem;color:var(--fg)}
details.team li{break-inside:avoid;padding:2px 0}
details.team li::marker{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media (min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
/* person tile */
.tile{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;border:0;padding:0;color:var(--fg)}
.ph{position:relative;aspect-ratio:4/5;background:var(--surface-2);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mono{display:grid;place-items:center;font-weight:800;letter-spacing:-.02em}
.ph .mono{position:absolute;inset:0;font-size:2.6rem}
.ph.np .shade{display:none}.ph.np .cap{color:var(--fg)}.ph.np .mono{padding-bottom:22%}
.ph .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(to top,rgba(20,10,8,.86),rgba(20,10,8,0));pointer-events:none}
.ph .cap{position:absolute;left:12px;right:12px;bottom:11px;color:#fff}
.ph .cap .nm{font-weight:700;font-size:1.02rem;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.ph .cap .rl{font-size:.78rem;opacity:.85;line-height:1.25;margin-top:2px}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:#5a2a20;font-size:.68rem;font-weight:700;padding:4px 8px;border-radius:999px;letter-spacing:.02em}
.storeno{position:absolute;top:10px;left:10px;min-width:44px;height:44px;padding:0 8px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tbar{display:flex;gap:6px;padding:8px}
.act{flex:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:0;cursor:pointer;font-size:.8rem;font-weight:600;min-width:0}
.act svg{width:16px;height:16px;flex:none}
.act.call{background:var(--accent);color:var(--accent-fg)}
.act.soft{background:var(--accent-soft);color:var(--accent)}
.act.mail{flex:0 0 38px;background:var(--accent-soft);color:var(--accent)}
.act.none{background:var(--surface-2);color:var(--muted);cursor:default}
.edit-flag{position:absolute;top:10px;right:10px;background:var(--fg);color:var(--bg);font-size:.72rem;font-weight:600;border-radius:999px;padding:4px 10px}

.oacts{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.oa{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 14px rgba(20,10,8,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .12s}
.oa:active{transform:scale(.92)}
.oa svg{width:20px;height:20px}
.oa.call{background:var(--accent);color:var(--accent-fg)}
.oa.mail{background:rgba(255,255,255,.92);color:#6e3326}
.tile:not(.wide) .oa{width:40px;height:40px}.tile:not(.wide) .oa svg{width:18px;height:18px}.tile:not(.wide) .oacts{top:8px;right:8px;gap:6px}

.omchip{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;max-width:calc(100% - 64px);background:rgba(255,255,255,.94);color:#3a2019;border-radius:999px;padding:3px 10px 3px 3px;font-size:.72rem;font-weight:700;box-shadow:0 2px 8px rgba(20,10,8,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.omf{flex:none;width:24px;height:24px;border-radius:50%;overflow:hidden;position:relative;background:var(--surface-2)}
.omf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.omf .mono{position:absolute;inset:0;font-size:.55rem}
.omf.lg{width:52px;height:52px}.omf.lg .mono{font-size:1rem}
.omgroup .omchip{display:none}
.omgroup{margin-top:18px}.omgroup:first-child{margin-top:0}
.omhead{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px;cursor:pointer;position:relative}
.omhead.plain{background:transparent;box-shadow:none;padding:4px 2px;cursor:default}
.omhead .omt{flex:1;min-width:0}.omhead .k{margin:0}
.omhead .omn{font-weight:700;font-size:1.05rem;line-height:1.2}
.omhead .omc{font-size:.8rem;color:var(--muted)}
.omhead .oa{position:static;flex:none}

.alllink{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;font-size:.85rem;cursor:pointer}
.alllink svg{width:16px;height:16px}
.q-h{flex-wrap:wrap}
.allbar{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.86rem;cursor:pointer;color:var(--fg)}
.fchip span{color:var(--muted);font-weight:500;margin-left:2px}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.fchip[aria-pressed="true"] span{color:inherit;opacity:.7}
.sortsw{display:inline-flex;align-self:flex-start;background:var(--surface-2);border-radius:12px;padding:3px}
.sortsw button{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.sortsw button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.arow-h{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.arow-h span:last-child{opacity:.7;font-weight:500}
.dic.xs{width:26px;height:26px;border-radius:8px}.dic.xs svg{width:15px;height:15px}
.alist{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-top:8px}
.arow-h+.alist{margin-top:0}
.arow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;min-height:64px}
.arow:first-child{border-top:0}.arow:hover{background:var(--surface-2)}
.aav{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;position:relative;background:var(--surface-2)}
.aav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.aav .mono{position:absolute;inset:0;font-size:.85rem}
.aav.nophoto{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--priv)}
.arow .who{flex:1;min-width:0}
.arow .nm{font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .rl{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .miss{font-size:.72rem;color:var(--priv);font-weight:600;margin-top:1px}
.oa.sm{position:static;width:40px;height:40px;box-shadow:none;flex:none}.oa.sm svg{width:18px;height:18px}
.edit-dot{flex:none;font-size:.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
/* wide tile */
.tile.wide{grid-column:1/-1}
.tile.wide .body{padding:14px 14px 4px;display:flex;flex-direction:column;gap:8px}
.tile.wide .ph{aspect-ratio:4/3}
.tile.wide .about{font-size:.88rem;color:var(--fg)}
.k{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.topics li{display:flex;gap:8px;font-size:.9rem;line-height:1.35}
.topics li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:.5em}
.areas{font-size:.78rem;color:var(--muted)}
@media (min-width:640px){
  .tile.wide{grid-column:span 2;flex-direction:row}
  .tile.wide .ph{aspect-ratio:auto;width:46%;min-height:100%;flex:none}
  .tile.wide .right{flex:1;min-width:0;display:flex;flex-direction:column}
  .tile.wide .body{flex:1}
}
@media (min-width:980px){.tile.wide{grid-column:span 2}}
.addtile{border:2px dashed var(--line);border-radius:20px;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;min-height:160px;display:grid;place-items:center;padding:12px}
.none{text-align:center;color:var(--muted);padding:60px 16px}
.legend{margin-top:34px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pill.P{background:var(--work-soft);color:var(--work)}
.pill.S{background:var(--priv-soft);color:var(--priv)}

/* home + navigation */
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.crumb .icon-btn{width:42px;height:42px}
.back{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.back svg{width:20px;height:20px}
.cr-t{min-width:0}.cr-n{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.home-depts{margin-top:28px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dtile{background:var(--surface);border:0;border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;color:var(--fg);min-height:132px}
.dtile .dn{font-weight:700;font-size:1rem;line-height:1.2;margin-top:auto;text-wrap:balance}
.dtile .dc{font-size:.8rem;color:var(--muted)}
.stack{display:flex}
.dt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-bottom:12px}
.dic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.dic svg{width:28px;height:28px}
.dic.sm{width:42px;height:42px;border-radius:13px}.dic.sm svg{width:22px;height:22px}
.dtile .stack .sf{width:28px;height:28px;margin-left:-8px}.dtile .stack .sf:first-child{margin-left:0}.dtile .stack .sf .mono{font-size:.6rem}
.icopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.icopick label{position:relative;cursor:pointer}
.icopick input{position:absolute;opacity:0;pointer-events:none}
.icopick span{display:grid;place-items:center;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.icopick span svg{width:24px;height:24px}
.icopick input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.icopick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sf{width:40px;height:40px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--surface);margin-left:-10px;background:var(--surface-2)}
.sf:first-child{margin-left:0}
.sf img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.sf .mono{position:absolute;inset:0;font-size:.8rem}
@media (max-width:639px){
  .ph{aspect-ratio:1/1}
  .tile.wide .ph{aspect-ratio:5/4}
  .tbar .act{height:42px}
  .act.call{font-size:.85rem}
  .grid.stores .ph{aspect-ratio:1/1}
}

.pinf{align-items:stretch;text-align:center;padding-bottom:4px}
.pin-ic{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:4px auto 0}
.pin-ic svg{width:24px;height:24px}
.pin-t{margin:-6px 0 0;color:var(--muted);font-size:.9rem}
.pin-in{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:1.6rem;letter-spacing:.5em;padding:0 0 0 .5em;width:100%;outline:none;font-variant-numeric:tabular-nums}
.pin-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pinf .f label{text-align:left}
.pin-err{min-height:1.2em;color:var(--danger);font-size:.88rem;font-weight:500}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,8,6,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:540px;max-height:94vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .pad{padding:0 20px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto}
@media (min-width:760px){.scrim{align-items:center;padding:24px}.sheet{border-radius:26px;padding-bottom:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero-ph{position:relative;margin:0 20px;aspect-ratio:1/1;max-height:340px;width:calc(100% - 40px);border-radius:22px;overflow:hidden;background:var(--surface-2)}
.hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ph .mono{position:absolute;inset:0;font-size:4rem}
.hero-ph .storeno{width:60px;height:60px;font-size:1.6rem;top:14px;left:14px;border-radius:18px}
.s-nm{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-top:16px}
.s-rl{color:var(--muted);font-size:.92rem;margin-top:3px}
.s-sec{margin-top:18px}
.s-sec .k{margin:0 0 6px 2px}
.card2{background:var(--surface-2);border-radius:16px;overflow:hidden}
.line{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line);min-width:0}
.line:first-child{border-top:0}
.line .v{flex:1;min-width:0}
.line .v a{color:var(--fg);text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.line .v .kk{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:2px}
.mini{flex:none;height:34px;padding:0 12px;border-radius:10px;border:0;background:var(--surface);color:var(--fg);font-size:.8rem;font-weight:600;cursor:pointer}
.empty{padding:12px 14px;color:var(--muted);font-size:.9rem}
.s-box{background:var(--surface-2);border-radius:16px;padding:14px}
.foot{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;height:50px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;padding:0 16px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--danger);background:transparent;width:100%;flex:none;margin-top:8px}
/* form */
.form{display:flex;flex-direction:column;gap:14px;padding:4px 20px 0}
.form h3{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.flabel{font-size:.75rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;min-width:0;width:100%;outline:none}
.f input,.f select{height:46px}
.f textarea{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.4}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .hint{font-size:.75rem;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrow{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:8px}
.group{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.photo-ed{display:flex;align-items:center;gap:14px}
.photo-ed .pv{width:92px;height:115px;border-radius:14px;overflow:hidden;position:relative;background:var(--surface);flex:none}
.photo-ed .pv img{width:100%;height:100%;object-fit:cover}
.photo-ed .pv .mono{position:absolute;inset:0;font-size:1.8rem}
.photo-ed .b{display:flex;flex-direction:column;gap:8px}
/* save bar + toast */
.savebar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:620px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.savebar .msg{flex:1;font-size:.86rem;line-height:1.3;min-width:0}
.savebar button{height:40px;border-radius:12px;border:0;padding:0 14px;font-weight:600;cursor:pointer}
.savebar .ghost{background:transparent;color:var(--bg);opacity:.75}
.savebar .go{background:var(--bg);color:var(--fg)}
.savebar .go:disabled{opacity:.4}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:380px){.two,.phrow{grid-template-columns:1fr}.ph .cap .nm{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}.toast{transition:none}}

const dIcon=d=>(DI[d.icon]||DI[d.id]||DI.hvezda).s;
function faces(d){
  const list=D().contacts.filter(c=>c.d===d.id).sort((a,b)=>(b.photo?1:0)-(a.photo?1:0)||(b.lead?1:0)-(a.lead?1:0)).slice(0,4);
  return `<div class="stack">${list.map(c=>`<span class="sf">${face(c)}</span>`).join('')}</div>`;
}
let allF='vse', allSort='dept';
function allView(){
  const deps=D().depts, di=id=>deps.findIndex(d=>d.id===id), dn=id=>(deps.find(d=>d.id===id)||{}).name||'';
  const all=D().contacts;
  const F={vse:['Všichni',()=>true],foto:['Bez fotky',c=>!c.photo],tel:['Bez telefonu',c=>!personPhone(c)&&!(isStore(c)&&c.sp)],mail:['Bez e-mailu',c=>!(c.em||[]).filter(Boolean).length]};
  if(!F[allF]) allF='vse';
  let list=all.filter(F[allF][1]);
  const title=c=>isStore(c)?(c.place||'Prodejna'):c.name;
  list.sort(allSort==='az'?(a,b)=>title(a).localeCompare(title(b),'cs'):(a,b)=>di(a.d)-di(b.d)||(b.lead?1:0)-(a.lead?1:0)||title(a).localeCompare(title(b),'cs'));
  const chips=`<div class="allbar"><div class="fchips" role="group" aria-label="Filtr">${Object.entries(F).map(([k,[l,f]])=>`<button class="fchip" data-af="${k}" aria-pressed="${k===allF}">${l} <span>${all.filter(f).length}</span></button>`).join('')}</div><div class="sortsw" role="group" aria-label="Řazení"><button data-as="dept" aria-pressed="${allSort==='dept'}">Podle oddělení</button><button data-as="az" aria-pressed="${allSort==='az'}">A–Z</button></div></div>`;
  if(!list.length) return chips+`<p class="none">Tady nikdo není. 🎉</p>`;
  let html='', cur=null;
  for(const c of list){
    if(allSort==='dept'&&c.d!==cur){if(cur!==null)html+='</div>';cur=c.d;const n=list.filter(x=>x.d===cur).length;html+=`<div class="arow-h"><span class="dic xs">${dIcon(deps.find(d=>d.id===cur)||{id:cur})}</span>${esc(dn(cur))}<span>${n}</span></div><div class="alist">`;}
    else if(allSort==='az'&&cur===null){cur='az';html+='<div class="alist">';}
    const pp=isStore(c)?(c.sp||personPhone(c)):personPhone(c);
    const miss=[!c.photo?'fotka':'',!pp?'telefon':'',!(c.em||[]).filter(Boolean).length?'e-mail':''].filter(Boolean);
    const sub=isStore(c)?`${c.name||'provozní nevyplněna'} · č. ${c.no||'–'}`:[c.role,allSort==='az'?dn(c.d):''].filter(Boolean).join(' · ');
    html+=`<div class="arow" role="button" tabindex="0" data-open="${esc(c.id)}"><span class="aav${c.photo?'':' nophoto'}">${face(c)}</span><div class="who"><div class="nm">${esc(title(c))}</div><div class="rl">${esc(sub)}</div>${allF==='vse'&&miss.length?`<div class="miss">chybí: ${miss.join(', ')}</div>`:''}</div>${draft?'<span class="edit-dot">Upravit</span>':pp?`<a class="oa call sm" href="${tel(pp)}" data-stop aria-label="Zavolat ${esc(title(c))}">${I.tel}</a>`:''}</div>`;
  }
  return chips+html+'</div>';
}
function render(){
  const nq=norm(q.trim()), dg=nq.replace(/\D/g,'');
  const head=document.getElementById('crumb');
  let out='';
  if(nq){
    let total=0;
    const qs=D().quick.filter(x=>hit(x.t+' '+x.d,nq));
    if(qs.length){out+=`<section class="quick"><div class="q-h"><h2>Na tohle je</h2></div><div class="q-row">${qs.map(qcard).join('')}</div></section>`;total+=qs.length;}
    for(const d of D().depts){const r=deptSection(d,nq,dg,false);if(r.n){total+=r.n;out+=r.html;}}
    if(!total) out=`<p class="none">Nic jsme nenašli.<br>Zkuste jméno, prodejnu, téma (třeba „multisport“) nebo část čísla.</p>`;
    head.hidden=true;document.getElementById('top').hidden=false;
  } else if(view==='home'){
    const qs=D().quick;
    if(qs.length||draft) out+=`<section class="quick"><div class="q-h"><h2>Co potřebujete vyřešit?</h2></div><div class="q-row">${qs.map(qcard).join('')}${draft?'<button class="qcard add-q" data-addq>+ Přidat téma</button>':''}</div></section>`;
    out+=`<section class="home-depts"><div class="q-h"><h2>Oddělení</h2><button class="alllink" data-go="all">${I.list}Všechny kontakty</button></div><div class="dgrid">${D().depts.map(d=>{const n=D().contacts.filter(c=>c.d===d.id).length;return `<button class="dtile" data-go="${esc(d.id)}"><span class="dt-top"><span class="dic">${dIcon(d)}</span>${faces(d)}</span><span class="dn">${esc(d.name)}</span><span class="dc">${n} ${d.id==='prodejny'?(n>=5||n===0?'prodejen':'prodejny'):(n===1?'člověk':n>=2&&n<=4?'lidé':'lidí')}</span></button>`;}).join('')}</div></section>`;
    head.hidden=true;document.getElementById('top').hidden=false;
  } else if(view==='all'){
    head.hidden=false;document.getElementById('top').hidden=true;
    head.innerHTML=`<button class="back" data-go="home" aria-label="Zpět na přehled">${I.back}</button><span class="dic sm">${I.list}</span><div class="cr-t" style="flex:1"><div class="cr-n">Všechny kontakty</div></div><button class="icon-btn" data-et aria-label="Upravit kontakty" title="Upravit kontakty"${!art||readOnly||draft?' hidden':''}>${I.pen}</button>`;
    out+=allView();
  } else {
    const d=D().depts.find(x=>x.id===view);
    if(!d){view='home';return render();}
    head.hidden=false;document.getElementById('top').hidden=true;
    head.innerHTML=`<button class="back" data-go="home" aria-label="Zpět na přehled">${I.back}</button><span class="dic sm">${dIcon(d)}</span><div class="cr-t" style="flex:1"><div class="cr-n">${esc(d.name)}</div></div><button class="icon-btn" data-et aria-label="Upravit kontakty" title="Upravit kontakty"${!art||readOnly||draft?' hidden':''}>${I.pen}</button>`;
    out+=deptSection(d,'','',false).html||'<p class="none">Zatím tu nikdo není.</p>';
  }
  document.getElementById('out').innerHTML=out;
  bar();
}

function readPhoto(file){
  return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const W=480,H=600,cv=document.createElement('canvas');cv.width=W;cv.height=H;const r=W/H;let sw=img.width,sh=img.height;if(sw/sh>r){sw=sh*r;}else{sh=sw/r;}const sx=(img.width-sw)/2,sy=Math.max(0,(img.height-sh)*0.3);cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,W,H);res(cv.toDataURL('image/jpeg',.78));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});
}

}
function submitDept(){const d=draft.depts.find(x=>x.id===sheet.id);const ic=document.querySelector('input[name=dic]:checked');if(ic)d.icon=ic.value;d.name=val('dn')||d.name;d.about=val('da');d.note=val('dno');d.teamTitle=val('dtt');d.team=lines('dtm');done();}
function submitQuick(){const x=sheet.x;x.t=val('qt');x.d=val('qd');x.who=val('qw');if(!x.t){toast('Doplňte téma.');return;}const i=draft.quick.findIndex(k=>k.id===x.id);if(i<0)draft.quick.push(x);else draft.quick[i]=x;done();}
function done(msg){dirty++;closeSheet();render();toast(msg||'Připraveno. Nezapomeňte uložit.');}

/* ---------- GitHub ukládání ---------- */
const GH={owner:'liberskelahudky',repo:'kontakty',branch:'main'};
let memTok=''; const upl=new Map();
function tok(){if(memTok)return memTok;try{return localStorage.getItem('ll_kontakty_token')||'';}catch(_){return '';}}
function setTok(t){memTok=t;try{t?localStorage.setItem('ll_kontakty_token',t):localStorage.removeItem('ll_kontakty_token');}catch(_){}}
const API=p=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${p}`;
const hdr=()=>({Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json'});
const b64u=s=>btoa(unescape(encodeURIComponent(s)));
async function putFile(path,content,msg){
  let sha;
  const g=await fetch(API(path)+'?ref='+GH.branch+'&t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(g.status===200) sha=(await g.json()).sha;
  else if(g.status!==404) throw {code:g.status};
  const r=await fetch(API(path),{method:'PUT',headers:hdr(),body:JSON.stringify({message:msg,content,branch:GH.branch,sha})});
  if(!r.ok) throw {code:r.status};
  return r.json();
}
function askToken(){
  sheet={kind:'token'};
  openSheet(`<form class="form pinf" id="tokform"><div class="pin-ic">${I.lock}</div><h3>Připojit ukládání</h3>
   <p class="pin-t">Změny se ukládají na GitHub. Na tomto zařízení je potřeba jednou zadat GitHub token s právem zapisovat do repozitáře kontakty.</p>
   <div class="f"><label for="tok">GitHub token</label><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></div>
   <div class="pin-err" id="pinerr" role="alert"></div>
   <div class="foot"><button type="button" class="btn" data-close>Zrušit</button><button type="submit" class="btn primary">Uložit</button></div></form>`);
}
function submitToken(){const t=val('tok');if(!t){document.getElementById('pinerr').textContent='Vložte token.';return;}setTok(t);closeSheet();save();}
async function save(){
  if(!tok()){askToken();return;}
  const b=document.getElementById('save'); if(b){b.disabled=true;b.textContent='Ukládám…';}
  const d=new Date(); draft.updated=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    const out=JSON.parse(JSON.stringify(draft));
    for(const c of out.contacts){
      if(!c.photo||!c.photo.startsWith('data:')) continue;
      let path=upl.get(c.photo);
      if(!path){path=`fotky/${c.id}-${Date.now().toString(36)}.jpg`;await putFile(path,c.photo.split(',')[1],'Fotka: '+(c.name||c.place||c.id));upl.set(c.photo,path);}
      c.photo=path;
    }
    await putFile('data.json',b64u(JSON.stringify(out,null,1)),'Úprava kontaktů');
    data=draft; draft=null; dirty=0; render();
    toast('Uloženo. Kolegové změnu uvidí zhruba do minuty.');
  }catch(e){
    const code=e&&e.code;
    if(b){b.textContent='Uložit';b.disabled=false;}
    if(code===401){setTok('');toast('Token nefunguje. Zadejte ho znovu.');askToken();}
    else if(code===403||code===404) toast('Token nemá právo zapisovat do repozitáře kontakty.');
    else if(code===409||code===422) toast('Někdo ukládal ve stejnou chvíli. Klepněte na Uložit znovu.');
    else toast('Uložení se nepovedlo. Zkontrolujte připojení a zkuste to znovu.');
  }
}
async function loadData(){
  try{
    let j=null;
    if(tok()){
      const r=await fetch(API('data.json')+'?ref='+GH.branch+'&t='+Date.now(),{headers:Object.assign(hdr(),{Accept:'application/vnd.github.raw+json'}),cache:'no-store'});
      if(r.ok) j=await r.json();
    }
    if(!j){const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok) j=await r.json();}
    if(j&&j.contacts&&!draft){data=j;data.quick=data.quick||[];render();}
  }catch(_){}
}

/* ---------- events ---------- */
root.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();}});
root.addEventListener('change',async e=>{
  if(e.target.id==='md'&&sheet){const s=e.target.value==='prodejny';document.getElementById('storeFields').hidden=!s;document.getElementById('infoFields').hidden=s;document.getElementById('leadRow').hidden=s;document.getElementById('personLabel').textContent=s?'Provozní':'Člověk';}
  if(e.target.id==='mphoto'&&sheet&&e.target.files[0]){
    try{sheet.photo=await readPhoto(e.target.files[0]);document.getElementById('mava').innerHTML=face({name:val('mn')||'?',photo:sheet.photo});document.getElementById('mphotodel').hidden=false;}
    catch(_){toast('Tenhle soubor nejde načíst jako obrázek.');}
  }
});
root.addEventListener('submit',e=>{e.preventDefault();({pform:submitPerson,dform:submitDept,qform:submitQuick,pinform:submitPin,pinchange:submitPinChange,tokform:submitToken}[e.target.id]||(()=>{}))();});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.open){e.preventDefault();e.target.click();}});
root.addEventListener('click',e=>{
  if(e.target.id==='scrim'){closeSheet();return;}
  if(e.target.closest('[data-stop]')) return;
  const t=e.target.closest('button,[data-open]'); if(!t) return;
  const ds=t.dataset;
  if(ds.af){allF=ds.af;render();return;}
  if(ds.as){allSort=ds.as;render();return;}
  if(ds.go){view=ds.go;q='';document.getElementById('q').value='';render();window.scrollTo({top:0});return;}
  if(ds.copy!==undefined){const v=ds.copy,fb=()=>{const i=document.createElement('textarea');i.value=v;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('Zkopírováno');}catch(_){toast(v);}i.remove();};if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast('Zkopírováno'),fb);else fb();return;}
  if(ds.close!==undefined){closeSheet();return;}
  if(ds.open){const c=D().contacts.find(x=>x.id===ds.open);if(c)draft?editor(c,false):detail(c);return;}
  if(ds.quick){const x=D().quick.find(k=>k.id===ds.quick);if(!x)return;if(draft){quickEditor(x,false);return;}const c=D().contacts.find(k=>k.id===x.who);if(c)detail(c);return;}
  if(ds.addq!==undefined){quickEditor({id:'q'+Date.now().toString(36),t:'',d:'',who:''},true);return;}
  if(ds.dedit){deptEditor(D().depts.find(d=>d.id===ds.dedit));return;}
  if(ds.add){editor({id:'c'+Date.now().toString(36),d:ds.add,name:'',role:'',ph:[],em:[],photo:'',lead:false,about:'',topics:[],areas:''},true);return;}
  if(t.id==='editToggle'||ds.et!==undefined){requestEdit();return;}
  if(t.id==='pinbtn'){pinChanger();return;}
  if(t.id==='discard'){if(dirty&&ds.sure!=='1'){ds.sure='1';t.textContent='Opravdu?';return;}draft=null;dirty=0;render();return;}
  if(t.id==='save'){save();return;}
  if(t.id==='mphotodel'){sheet.photo='';document.getElementById('mava').innerHTML=face({name:val('mn')||'?',photo:''});t.hidden=true;return;}
  if(t.id==='pdel'){if(ds.sure!=='1'){ds.sure='1';t.textContent='Opravdu smazat?';return;}const id=sheet.c.id;draft.contacts=draft.contacts.filter(c=>c.id!==id);draft.quick.forEach(x=>{if(x.who===id)x.who='';});done('Smazáno. Nezapomeňte uložit.');return;}
  if(t.id==='qdel'){if(ds.sure!=='1'){ds.sure='1';t.textContent='Opravdu smazat?';return;}draft.quick=draft.quick.filter(x=>x.id!==sheet.x.id);done('Smazáno. Nezapomeňte uložit.');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ---------- PIN ---------- */
const PSALT='LL-kontakty:';
function cyrb(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
const pinHash=p=>cyrb(PSALT+p,7)+cyrb(PSALT+p,131);
let pinFails=0, pinLockUntil=0;
function pinOk(){try{return sessionStorage.getItem('ll-pin')===data.pinHash;}catch(_){return false;}}
function pinRemember(){try{sessionStorage.setItem('ll-pin',data.pinHash);}catch(_){}}
function startEdit(){draft=JSON.parse(JSON.stringify(data));dirty=0;closeSheet();render();toast('Režim úprav. Klepněte na kartu.');}
function requestEdit(){
  if(pinOk()){startEdit();return;}
  sheet={kind:'pin'};
  openSheet(`<form class="form pinf" id="pinform"><div class="pin-ic">${I.lock}</div><h3>Zadejte PIN</h3><p class="pin-t">Upravovat kontakty může jen ten, kdo zná PIN.</p>
   <input id="pin" class="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" aria-label="PIN">
   <div class="pin-err" id="pinerr" role="alert"></div>
   <div class="foot"><button type="button" class="btn" data-close>Zrušit</button><button type="submit" class="btn primary">Pokračovat</button></div></form>`);
  setTimeout(()=>{const i=document.getElementById('pin');if(i)i.focus();},60);
}
function submitPin(){
  const err=document.getElementById('pinerr'), inp=document.getElementById('pin');
  const now=Date.now();
  if(now<pinLockUntil){err.textContent=`Moc pokusů. Zkuste to za ${Math.ceil((pinLockUntil-now)/1000)} s.`;return;}
  if(pinHash(inp.value.trim())===data.pinHash){pinFails=0;pinRemember();startEdit();return;}
  pinFails++; inp.value=''; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
  if(pinFails>=5){pinLockUntil=now+30000;pinFails=0;err.textContent='Moc pokusů. Zkuste to za 30 s.';}
  else err.textContent='Špatný PIN. Zkuste to znovu.';
  inp.focus();
}
function pinChanger(){
  sheet={kind:'pinchange'};
  openSheet(`<form class="form pinf" id="pinchange"><div class="pin-ic">${I.lock}</div><h3>Změnit PIN</h3><p class="pin-t">Nový PIN platí po uložení změn.</p>
   <div class="f"><label for="np1">Nový PIN (4–8 číslic)</label><input id="np1" class="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8"></div>
   <div class="f"><label for="np2">Nový PIN znovu</label><input id="np2" class="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8"></div>
   <div class="pin-err" id="pinerr" role="alert"></div>
   <div class="foot"><button type="button" class="btn" data-close>Zrušit</button><button type="submit" class="btn primary">Nastavit</button></div></form>`);
}
function submitPinChange(){
  const a=val('np1'),b=val('np2'),err=document.getElementById('pinerr');
  if(!/^\d{4,8}$/.test(a)){err.textContent='PIN musí mít 4 až 8 číslic.';return;}
  if(a!==b){err.textContent='PINy se neshodují.';return;}
  draft.pinHash=pinHash(a); done('Nový PIN nastaven. Nezapomeňte uložit.');
}

shell(); render();
(function hint(){
  const inp=document.getElementById('q'); if(!inp) return;
  const base='Jméno, oddělení nebo co řešíte';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){inp.placeholder=base;return;}
  const ex=['Petra Dlouhá','účetní','potřebuju čip','MultiSport','prodejna Letná','mzda Vestec'];
  let i=0,j=0,del=false,wait=0;
  setInterval(()=>{
    const el=document.getElementById('q'); if(!el) return;
    if(document.activeElement===el||el.value){el.placeholder=base;return;}
    if(wait>0){wait--;return;}
    const w=ex[i];
    if(!del){j++;if(j>=w.length){del=true;wait=22;}}
    else{j-=2;if(j<=0){j=0;del=false;i=(i+1)%ex.length;wait=4;}}
    el.placeholder='Zkuste: '+w.slice(0,j)+(del&&j===0?'':'|');
  },70);
})();
loadData();
})();
</script>
